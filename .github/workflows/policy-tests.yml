name: Offline compliance policy tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compliance-as-code-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install checksum-verified Conftest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/conftest_0.48.0_Linux_x86_64.tar.gz
          curl -fsSLo conftest-checksums.txt https://github.com/open-policy-agent/conftest/releases/download/v0.48.0/checksums.txt
          sed 's/conftest_0.48.0_Linux_x86_64.tar.gz/conftest.tar.gz/' conftest-checksums.txt | grep ' conftest.tar.gz$' | sha256sum --check -
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
      - name: Confirm safe workload is accepted
        run: conftest test infrastructure/prod/compliant-deployment.yaml -p policies/opa -n compliance.pci_dss
      - name: Confirm unsafe Kubernetes workload is rejected
        shell: bash
        run: |
          if conftest test test-workloads/negative-fixtures/non-compliant-deployment.yaml -p policies/opa -n compliance.pci_dss; then
            echo "::error::Unsafe Kubernetes fixture was incorrectly accepted"
            exit 1
          fi
      - name: Confirm unsafe Terraform plan is rejected
        shell: bash
        run: |
          python3 -m json.tool test-workloads/negative-fixtures/tf-plan-negative.json >/dev/null
          if conftest test test-workloads/negative-fixtures/tf-plan-negative.json -p policies/opa -n compliance.pci_dss; then
            echo "::error::Unsafe Terraform fixture was incorrectly accepted"
            exit 1
          fi
      - name: Test audit evidence generator
        run: python3 -m unittest discover -s tests -v
      - name: Validate Python audit reporter syntax
        run: python3 -m py_compile scripts/generate-audit-pack.py
